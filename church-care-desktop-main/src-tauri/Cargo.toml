[package]
name = "church-care-app"
version = "1.3.1"
description = "Desktop App for Egyptian Church Social Care"
authors = ["Antigravity"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "blocking"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
aes-gcm = "0.10"
obfstr = "0.4"
chrono = { version = "0.4", features = ["serde"] }
lopdf = "0.34"
unicode-bidi = "0.3"
rustybuzz = "0.18"
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
